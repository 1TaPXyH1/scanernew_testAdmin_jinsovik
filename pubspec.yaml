name: jinsovik_scanner
description: Jinsovik Сканер - Сканування штрихкодів

version: 1.4.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.11.3
  path_provider: ^2.1.2
  intl: ^0.18.1
  mobile_scanner: ^7.4.0
  http: ^1.2.1
  printing: ^5.12.0
  provider: ^6.1.1
  connectivity_plus: ^5.0.2
  package_info_plus: ^8.3.0
  vibration: ^3.1.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/calibri.ttf
    - assets/fonts/calibrib.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon-app.png"
  min_sdk_android: 21
