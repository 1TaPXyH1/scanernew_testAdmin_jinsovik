workflows:
  ios-dev:
    name: iOS Development Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS (debug)
        script: flutter build ios --debug --no-codesign
      - name: Create IPA
        script: |
          set -e
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphoneos -derivedDataPath ../build/ios/derived -destination generic/platform=iOS archive -archivePath ../build/ios/archive/Runner.xcarchive
          mkdir -p ../build/ios/ipa
          xcodebuild -exportArchive -archivePath ../build/ios/archive/Runner.xcarchive -exportPath ../build/ios/ipa -exportOptionsPlist ../codemagic_export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - melnikovnikita691@gmail.com